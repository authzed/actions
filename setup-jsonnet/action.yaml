---
name: "Setup Go Jsonnet"
description: "Download and install Go Jsonnet"
inputs:
  version:
    description: "Version of Jsonnet to install. Default: `v0.21.0`"
    required: false
    default: "v0.21.0"
runs:
  using: "composite"
  steps:
    - uses: "zendesk/setup-jsonnet@76fef91403b40b20e4344a88f6c06a85be4f97d4"  # v17
      with:
        version: "${{ inputs.version }}"
