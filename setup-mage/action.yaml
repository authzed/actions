---
name: "Setup Mage"
description: "Download and install Mage"
inputs:
  version:
    description: "Version of Mage to install"
    default: "v1.15.0"
    required: false
runs:
  using: "composite"
  steps:
    - uses: "magefile/mage-action@a662bd8c29d8106879588cfff83b2faf6e6f59db"  # v4.0.0
      with:
        version: "${{ inputs.version }}"
        install-only: true
