---
name: "Buf - Generate"
description: |
  This action runs `./buf.gen.yaml` in the working tree and then verifies
  that there are no differences from running the tool.
inputs:
  version:
    description: "Buf version used to generate"
    default: "1.18.0"
    required: false
  github_token:
    description: "explicit passing of GITHUB_TOKEN secret"
    required: true
runs:
  using: "composite"
  steps:
    - uses: "bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6"  # v1.7.0
      with:
        version: "${{ inputs.version }}"
        github_token: "${{ inputs.github_token }}"
    - name: "Generate & Diff Protos"
      shell: "bash"
      run: "./buf.gen.yaml"
    - name: "Verify Buf Generate"
      uses: "chainguard-dev/actions/nodiff@d496b2ab65497cac13d77ccd5038b8aae7e8c43b"  # v1.8.2
      with:
        fixup-command: "./buf.gen.yaml"
