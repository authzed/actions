---
name: "Setup Go environment"
description: "Setup a Go environment and add it to the PATH (with caching!)"
inputs:
  go-version:
    description: "The Go version to download (if necessary) and use. Supports semver spec and ranges."
    default: "1.26.9"
  go-version-file:
    description: "Path to the go.mod or go.work file."
  cache:
    description: "Whether to restore and save the built-in Go module and build caches."
    default: "true"
    required: false
  cache-dependency-path:
    description: "Used to specify the path to a dependency file - go.sum"
    default: "**/go.sum"
  download:
    description: "Whether or not to run go mod download as part of setup"
    default: "true"
    required: false
  working_directory:
    description: "The directory with the root of the project"
    default: "."
    required: false
  download-attempts:
    description: "How many times to try go mod download before failing. A module proxy error such as a reset stream otherwise fails the job."
    default: "3"
    required: false
runs:
  using: "composite"
  steps:
    - uses: "actions/setup-go@v6"
      with:
        go-version: "${{ inputs.go-version }}"
        go-version-file: "${{ inputs.go-version-file }}"
        cache-dependency-path: "${{ inputs.cache-dependency-path }}"
        cache: "${{ inputs.cache }}"
    # With a comma, the go command falls back to the next source only when the
    # proxy answers 404 or 410. With a pipe it falls back on any error, so a reset
    # stream or a timeout from proxy.golang.org is fetched from the origin instead
    # of failing the job. A GOPROXY the caller sets is left as it is.
    - name: "Configure Module Proxy Fallback"
      shell: "bash"
      run: |
        if [ -z "${GOPROXY:-}" ]; then
          echo "GOPROXY=https://proxy.golang.org|direct" >> "$GITHUB_ENV"
        fi
    - name: "Run Go Mod Download"
      if: "inputs.download == 'true'"
      working-directory: "${{ inputs.working_directory }}"
      shell: "bash"
      env:
        ATTEMPTS: "${{ inputs.download-attempts }}"
      run: |
        for attempt in $(seq 1 "$ATTEMPTS"); do
          go mod download && exit 0
          echo "::warning::go mod download failed (attempt $attempt of $ATTEMPTS)"
          sleep $((attempt * 10))
        done
        exit 1
    - name: "Run Magefiles Go Mod Download"
      if: "inputs.download == 'true'"
      working-directory: "${{ inputs.working_directory }}"
      shell: "bash"
      env:
        ATTEMPTS: "${{ inputs.download-attempts }}"
      run: |
        [ -d './magefiles' ] || exit 0
        cd './magefiles'
        for attempt in $(seq 1 "$ATTEMPTS"); do
          go mod download && exit 0
          echo "::warning::magefiles go mod download failed (attempt $attempt of $ATTEMPTS)"
          sleep $((attempt * 10))
        done
        # A magefiles download failure has never failed setup; keep it that way.
        exit 0
